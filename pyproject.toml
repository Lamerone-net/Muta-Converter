[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muta-converter"
dynamic = ["version"]
description = "Conversioni locali dal menu contestuale, per Windows, macOS e Linux"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<14", "PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
heif = ["pillow-heif>=1.0,<2"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
muta = "muta.cli:main"

[project.gui-scripts]
muta-gui = "muta.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["muta*"]

[tool.setuptools.dynamic]
version = {attr = "muta.__version__"}
