name: Publish release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
  publish:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag and extract notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/release.py --check-tag "$RELEASE_TAG"
          python scripts/release.py --notes > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: Muta-*
          path: packages
          merge-multiple: true
      - name: Publish version and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" packages/* --clobber
          else
            gh release create "$RELEASE_TAG" packages/* --verify-tag --title "Muta Converter $RELEASE_TAG" --notes-file release-notes.md
          fi
