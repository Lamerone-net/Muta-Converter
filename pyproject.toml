[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muta"
dynamic = ["version"]
description = "Muta: a local file converter for Windows, macOS and Linux"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<14", "PySide6-Essentials==6.10.2", "defusedxml>=0.7.1,<1", "vtracer==0.6.15"]

[project.optional-dependencies]
heif = ["pillow-heif>=1.0,<2"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
muta = "muta.cli:main"

[project.gui-scripts]
muta-gui = "muta.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["muta*"]

[tool.setuptools.dynamic]
version = {attr = "muta.__version__"}

[tool.setuptools.package-data]
muta = ["locales/*.json"]
