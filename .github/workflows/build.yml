name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -e ".[build,heif]"
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check release version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/release.py --check-tag "$RELEASE_TAG"
        shell: bash
      - run: python scripts/build.py
        if: runner.os != 'Windows'
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 is required on this runner" }
          python scripts/build.py --installer --iscc $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Muta-${{ runner.os }}-${{ runner.arch }}
          path: build/release/
